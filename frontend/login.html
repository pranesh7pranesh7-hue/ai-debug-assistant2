<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugSense AI — Developer Login</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="card" style="max-width: 420px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-flex; width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan)); border-radius: 12px; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px;">
          🛡️
        </div>
        <h2>BugSense AI</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">Sign in to your debugging workspace</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="developer@example.com" required value="demo@bugsense.ai" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required value="password123" />
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
        Don't have an account? <a href="register.html">Create an account</a>
      </div>

      <div style="margin-top: 20px; padding: 12px; background: rgba(99, 102, 241, 0.08); border-radius: var(--radius-sm); border: 1px dashed rgba(99, 102, 241, 0.3); font-size: 12px; color: var(--text-secondary); text-align: center;">
        💡 <strong>Quick Demo Credentials:</strong><br>
        Email: <code>demo@bugsense.ai</code> | Password: <code>password123</code>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from './assets/js/auth.js';
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      try {
        await login(email, password);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
